# Publishes the site to GitHub Pages on every push to main.
#
# The content JSON files are the source of truth. This workflow regenerates the
# navigation and the search index from them before publishing, and refuses to
# deploy if tools/build-index.js finds a problem (a lesson with no "L'essentiel"
# box, a missing Récap express, a duplicate verb id, and so on). A broken commit
# therefore never reaches the live site.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # lets you re-run a deploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, let the newer one finish and win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check the content and rebuild the index
        run: node tools/build-index.js

      - uses: actions/configure-pages@v6

      - name: Package the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
