<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Manuel de Français</title>
<meta name="description" content="Manuel de français interactif, A1 à B2 — grammaire, vocabulaire, conjugaison et exercices.">
<meta name="color-scheme" content="light dark">
<!-- Bump ?v= whenever you edit the CSS or JS, so browsers pick the new file up. -->
<link rel="stylesheet" href="assets/css/app.css?v=2">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
<script>
  // Applied before first paint so the page never flashes the wrong theme.
  (function () {
    try {
      var t = localStorage.getItem('mmf-theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
</head>
<body>

<a class="skip-link" href="#main">Aller au contenu</a>

<header class="topbar">
  <button class="icon-btn nav-toggle" id="navToggle" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>

  <a class="brand" href="#/">
    <span class="brand-mark" aria-hidden="true">📘</span>
    <span class="brand-text">Mon Manuel de Français</span>
  </a>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="searchInput" type="search" class="search-input" placeholder="Rechercher…  (touche /)"
           aria-label="Rechercher dans le site" autocomplete="off" spellcheck="false">
    <kbd class="search-kbd" aria-hidden="true">/</kbd>
  </div>

  <button class="icon-btn theme-btn" id="themeBtn" aria-label="Changer de thème" title="Clair / sombre">
    <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
  </button>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Navigation principale">
    <div class="sidebar-inner" id="sidebarInner"><!-- built by nav.js --></div>
  </nav>
  <div class="scrim" id="scrim" hidden></div>

  <main class="pane" id="main" tabindex="-1">
    <div id="view" class="view"></div>
  </main>
</div>

<div id="liveRegion" class="sr-only" role="status" aria-live="polite"></div>

<script src="assets/js/util.js"></script>
<script src="assets/js/tts.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/verbs.js"></script>
<script src="assets/js/exercises.js"></script>
<script src="assets/js/flashcards.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/search.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
